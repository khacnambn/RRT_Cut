local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint

  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.7 #0.5

  static_map: false #false
  rolling_window: true
  width: 3
  height: 3
  resolution: 0.05 #0.05

  # 15 m la vo nghia tren cua so 3x3 m; voi cost_scaling_factor 3.0 (thua ke tu
  # costmap_common) gradient da tat gan het sau 0.3 m.
  inflation_radius: 0.5 #15.0 #3.0 #10
