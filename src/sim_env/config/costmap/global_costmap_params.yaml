global_costmap:
  global_frame: map
  robot_base_frame: base_footprint

  update_frequency: 1.0 #1.0
  publish_frequency: 1.0 #1.0
  transform_tolerance: 0.5
  # Hai khoa nay VO HIEU vi global_costmap da khai bao `plugins`
  # (log: 'Pre-Hydro parameter ... unused since "plugins" is provided').
  # Khoi inflation_layer ben duoi moi la cai co tac dung.
  cost_scaling_factor: 2.0 #2.0
  inflation_radius: 0.4 #0.4 #0.8

  ### Sensor management parameters ###
  obstacle_layer:
    observation_sources: scan
    scan:
      {
        topic: scan,
        sensor_frame: base_footprint,
        observation_persistence: 0.0,
        expected_update_rate: 1.5, #0.8
        data_type: LaserScan,
        clearing: true,
        marking: true,
        max_obstacle_height: 0.8,
        min_obstacle_height: 0.0,
        obstacle_range: 2.5, #2.5
        raytrace_range: 3.0, #3.0
        inf_is_valid: true,
      }

  inflation_layer:
    enabled: true
    cost_scaling_factor: 2.0 # exponential rate at which the obstacle cost drops off (default: 10)
    # 0.3 m: vua tren ban kinh ngoai tiep robot (0.257 m). Thap hon nua thi
    # planner sinh duong ma footprint khong bam duoc.
    inflation_radius: 0.3 #0.4 # max. distance from an obstacle at which costs are incurred for planning paths.

  static_map:
    enabled: true
    clear_time: 20 #20
    publish_static_map: true
